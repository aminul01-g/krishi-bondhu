<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#2D6A4F" />
  <meta name="description" content="কৃষি বন্ধু — বাংলাদেশের কৃষকদের জন্য এআই-চালিত কৃষি সহায়ক। AI-powered agricultural assistant for Bangladeshi farmers." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />

  <!-- Leaflet (map library) loaded from CDN. We intentionally do NOT `npm install`
       leaflet / react-leaflet because outbound network is blocked in this
       environment; the app uses the global `window.L`. If the CDN is unreachable
       (offline), FieldHubPage renders a graceful fallback notice instead of
       crashing. Bundling react-leaflet is a follow-up once install/network works. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <title>কৃষি বন্ধু | KrishiBondhu</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
