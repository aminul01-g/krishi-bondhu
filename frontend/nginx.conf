# Production nginx config for the KrishiBondhu SPA.
# Serves the built static bundle and reverse-proxies API + WebSocket traffic to
# the backend service. The backend host is templated from $BACKEND_URL at
# container start (see note below); defaults to the docker-compose service name.

upstream krishi_backend {
    # docker-compose service name : port. Override by editing this file or
    # baking a different host in your own deployment.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- WebSocket endpoint (agent status) ---
    location /api/ws/ {
        proxy_pass http://krishi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --- REST API + SSE streaming ---
    location /api/ {
        proxy_pass http://krishi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/chat/stream): disable buffering so chunks flush immediately.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- Static assets: long cache (hashed filenames) ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA: everything else falls back to index.html for client routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
