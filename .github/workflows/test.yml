name: Production CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linting tools
        run: |
          pip install flake8
      - name: Run lint (syntax / undefined names — blocking)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run lint (style — non-blocking)
        run: |
          flake8 backend/app --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: |
          pip install bandit pip-audit
      - name: Bandit static security scan (non-blocking, high severity reported)
        run: |
          bandit -r backend/app -ll -x backend/app/tools,backend/tests || true
      - name: pip-audit dependency vulnerability scan (non-blocking)
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run Tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/farmdb
          REDIS_URL: redis://localhost:6379/0
          GROQ_API_KEY: ""
          HUGGINGFACE_API_KEY: ""
          WEATHER_API_KEY: ""
          # Tests rely on the insecure default secret; DEBUG keeps startup permissive.
          DEBUG: "true"
          ENVIRONMENT: "test"
        run: |
          cd backend
          pytest --tb=short -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
      - name: Lint
        run: |
          cd frontend
          npm run lint || true   # baseline has known non-blocking warnings; tighten to remove `|| true`
      - name: Unit tests
        run: |
          cd frontend
          npm test
      - name: Production build
        run: |
          cd frontend
          CI=false npm run build
      - name: npm audit (non-blocking)
        run: |
          cd frontend
          npm audit --omit=dev || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: |
          docker build -t krishibondhu-backend:test ./backend
      - name: Build Frontend Image
        run: |
          docker build -t krishibondhu-frontend:test ./frontend
