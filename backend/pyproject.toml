[project]
name = "krishibondhu-backend"
version = "0.2.0"
description = "Multi-agent agricultural assistant using CrewAI and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "aiofiles>=23.2.1",
    "pydantic>=2.0.0",
    # AI & Agents
    "crewai==0.28.8",
    "crewai-tools==0.1.6",
    "chromadb>=0.4.22",
    "google-generativeai>=0.4.0",
    "langchain-google-genai",
    "langchain-huggingface",
    "langchain-groq",
    "transformers>=4.37.0",
    "torch>=2.0.0",
    "Pillow>=10.2.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "geoalchemy2>=0.14.0",
    "pgvector>=0.1.0",
    "psycopg2-binary>=2.9.8",
    "python-dotenv>=1.0.0",
    "redis>=5.2.1",
    "prophet>=1.1.5",
    "structlog>=25.5.0",
    # Audio/Misc
    "gtts>=2.5.0",
    "cachetools>=5.3.2",
    "fpdf2>=2.7.8",
    # KrishiBondhu Phase 2 Features
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.0.0",
    "httpx>=0.26.0",
    # KrishiBondhu Phase 3 Features
    "sentence-transformers>=2.3.1",
    "pyzbar>=0.1.9",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "slowapi>=0.1.10",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets plain `async def test_*` run without decorating
# every test, and (critically) lets the async fixtures in tests/conftest.py be
# handled natively. Without this, modern pytest-asyncio (>=1.0) raises
# "requested an async fixture ... with no plugin or hook that handled it" and
# every async test errors at setup. Required for the suite to run at all.
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/seed/*",            # one-off data seeding
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
# Conservative starting floor: importing app.main in the test fixtures already
# executes most module-level code, so real coverage is well above this. Raise
# it as a ratchet once the CI baseline is observed (target 40% -> 60%).
fail_under = 15
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "black>=24.1.0",
    "isort>=5.13.2"
]
